name: Publish Prebuilt Libraries

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Trigger ladybug C++ prebuilt workflow
        env:
          GH_TOKEN: ${{ secrets.LADYBUG_BUILD_TOKEN }}
        run: |
          gh workflow run precompiled-bin-workflow.yml --repo skylence-be/ladybug \
            --field source_ref="${{ inputs.source_ref }}"
          sleep 10
          RUN_ID=$(gh run list \
            --repo skylence-be/ladybug \
            --workflow precompiled-bin-workflow.yml \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')
          echo "LADYBUG_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          echo "Triggered run: $RUN_ID"

      - name: Wait for build (~30 min)
        env:
          GH_TOKEN: ${{ secrets.LADYBUG_BUILD_TOKEN }}
        run: gh run watch "$LADYBUG_RUN_ID" --repo skylence-be/ladybug --exit-status

      - name: Download artifacts
        env:
          GH_TOKEN: ${{ secrets.LADYBUG_BUILD_TOKEN }}
        run: |
          gh run download "$LADYBUG_RUN_ID" \
            --repo skylence-be/ladybug \
            --dir raw-artifacts

      - name: Flatten to release-assets/
        run: |
          mkdir release-assets
          find raw-artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) \
            -exec cp {} release-assets/ \;
          ls -lh release-assets/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.tag }}"
          printf 'Prebuilt liblbug.a (static, with bundled dep archives) and shared libraries for all supported platforms.\n\nBuilt from skylence-be/ladybug run %s.\n\nUsed by scripts/download_lbug.sh in this repository.\n' "$LADYBUG_RUN_ID" > /tmp/release-notes.md
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes 2>/dev/null || true
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "lbug prebuilt libraries $TAG" \
            --notes-file /tmp/release-notes.md \
            release-assets/*
